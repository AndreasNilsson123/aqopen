<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AqOpen Sweden – Scoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B2545;
    --navy-2:#123A6B;
    --blue:#1668B5;
    --blue-soft:#E7EEF7;
    --paper:#F6F8FB;
    --card:#FFFFFF;
    --line:#D8E0EA;
    --ink:#0B2545;
    --muted:#5C6E84;
    --good:#1668B5;
    --warn:#B9531F;
    --gold:#C9A227;
    --radius:10px;
    --pad:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.45;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 12px 96px}

  /* ---------- header ---------- */
  header{
    position:relative;
    background:var(--navy);
    color:#fff;
    border-radius:0 0 var(--radius) var(--radius);
    padding:22px 18px 18px;
    overflow:hidden;
  }
  header .dots{
    position:absolute;left:14px;top:14px;width:78px;height:52px;opacity:.45;
    background-image:radial-gradient(circle, #6FA8E0 1.6px, transparent 1.7px);
    background-size:13px 13px;
  }
  header .slash{
    position:absolute;right:-30px;top:-40px;width:150px;height:150px;
    border-right:2px solid rgba(150,190,235,.5);
    border-top:2px solid rgba(150,190,235,.25);
    transform:rotate(35deg);
  }
  .brand{
    text-align:center;font-family:Inter,sans-serif;font-weight:700;
    font-size:34px;letter-spacing:-.5px;line-height:1;
  }
  .brand span{color:#5FA3E4}
  .brand-sub{
    text-align:center;font-family:"Barlow Condensed",sans-serif;
    letter-spacing:.42em;font-size:13px;margin-top:8px;color:#B9CDE6;
    text-indent:.42em;
  }
  .brand-rule{height:1px;background:rgba(255,255,255,.28);margin:12px 34px 10px}
  .brand-note{text-align:center;font-size:11.5px;letter-spacing:.18em;color:#8FB2D6;text-transform:uppercase}

  /* ---------- tabs ---------- */
  nav.tabs{
    display:flex;gap:6px;margin:14px 0 16px;overflow-x:auto;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:1 0 auto;white-space:nowrap;
    font-family:"Barlow Condensed",sans-serif;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;font-size:14px;
    padding:10px 14px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);cursor:pointer;
  }
  .tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* ---------- cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
  .card-head{
    background:var(--navy);color:#fff;border-radius:9px 9px 0 0;
    padding:11px 14px;font-family:"Barlow Condensed",sans-serif;
    letter-spacing:.14em;text-transform:uppercase;font-size:15px;font-weight:600;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .card-head.light{background:var(--blue-soft);color:var(--navy);border-bottom:1px solid var(--line)}
  .card-body{padding:14px}
  h3.sec{
    font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.14em;
    font-size:14px;color:var(--muted);margin:0 0 10px;font-weight:600;
  }

  /* ---------- leaderboard ---------- */
  .lb-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .lb-row:first-child{border-top:0}
  .rank{
    font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;
    width:26px;text-align:center;color:var(--line);line-height:1.1;flex:0 0 auto;
  }
  .lb-row.lead .rank{color:var(--gold)}
  .lb-main{flex:1;min-width:0}
  .lb-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .lb-name{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-pts{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:19px;color:var(--navy)}
  .lb-pts small{font-size:11px;color:var(--muted);font-family:Inter,sans-serif;margin-left:3px}
  .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#EDF1F6;margin:8px 0 6px}
  .bar i{display:block;height:100%}
  .s-stable{background:var(--navy)}
  .s-ctp{background:var(--blue)}
  .s-ld{background:#63A0DA}
  .s-tri{background:#9FC4E6}
  .s-cb{background:var(--gold)}
  .lb-break{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
  .lb-break b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:600}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:4px}
  .legend span{display:flex;align-items:center;gap:6px}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block}

  /* ---------- scorecard ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:7px 12px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer;
  }
  .chip[aria-pressed="true"],.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip.blue[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}

  table.holes{width:100%;border-collapse:collapse}
  table.holes th{
    font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.1em;
    font-size:12px;color:var(--muted);text-align:left;padding:0 0 8px;font-weight:600;
  }
  table.holes td{border-top:1px solid var(--line);padding:7px 0;vertical-align:middle}
  .hno{font-family:"IBM Plex Mono",monospace;font-weight:600;width:30px}
  .par{color:var(--muted);font-size:12.5px;width:48px}
  .tags{width:44px}
  .tag{
    display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;
    padding:2px 4px;border-radius:3px;background:var(--blue-soft);color:var(--blue);margin-right:2px;
  }
  .stepper{display:flex;align-items:center;gap:6px;justify-content:flex-end}
  .stepper button{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--navy);font-size:17px;line-height:1;cursor:pointer;font-weight:600;
  }
  .stepper button:active{background:var(--blue-soft)}
  .strokes{
    width:44px;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px;
    border:1px solid var(--line);border-radius:8px;padding:6px 2px;background:#fff;color:var(--ink);
  }
  .strokes.empty{color:#B7C2D0}
  .res{width:96px;text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .res b{font-family:"IBM Plex Mono",monospace;color:var(--navy);font-size:14px}
  .res.tri b{color:var(--warn)}
  tr.done .hno{color:var(--blue)}
  .totrow td{border-top:2px solid var(--navy);padding-top:10px;font-weight:600}

  .subcard{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:12px;background:#FCFDFE}
  .subcard h4{margin:0 0 4px;font-size:14px}
  .subcard p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
  .hole-pick{margin-bottom:12px}
  .hole-pick .lbl{font-size:12.5px;color:var(--muted);margin-bottom:5px}

  /* ---------- settings ---------- */
  .field{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .field label{width:88px;font-size:12.5px;color:var(--muted)}
  input[type=text],input[type=number],select{
    font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);width:100%;
  }
  .parGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
  .parCell{text-align:center}
  .parCell span{display:block;font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
  .parCell input{text-align:center;padding:6px 2px;font-family:"IBM Plex Mono",monospace}
  .btn{
    font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.12em;
    font-weight:600;font-size:14px;padding:10px 16px;border-radius:8px;cursor:pointer;
    border:1px solid var(--navy);background:var(--navy);color:#fff;
  }
  .btn.ghost{background:transparent;color:var(--navy)}
  .btn.danger{background:transparent;border-color:#C48B7A;color:var(--warn)}
  .rules{font-size:13px;color:var(--muted)}
  .rules li{margin-bottom:6px}
  .status{
    position:fixed;left:0;right:0;bottom:0;background:rgba(11,37,69,.95);color:#CFE0F2;
    font-size:12px;padding:8px 14px;text-align:center;backdrop-filter:blur(4px);
  }
  .status b{color:#fff}
  .empty-note{color:var(--muted);font-size:13px}
  @media (max-width:420px){
    .res{width:78px}
    .par{width:40px}
    .tags{width:36px}
  }
  @media (prefers-reduced-motion:no-preference){
    .card{transition:box-shadow .2s ease}
  }

  /* spelläge */
  .gm-hole{display:flex;align-items:center;gap:16px;padding-bottom:6px}
  .gm-num{font-family:"Barlow Condensed",sans-serif;font-size:60px;font-weight:700;line-height:.9;color:var(--navy)}
  .gm-par{font-size:15px;color:var(--muted);margin-bottom:4px}
  .gm-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .gm-name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gm-pts{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .gm-nav{display:flex;gap:8px;margin-top:16px}
  .gm-nav .btn{flex:1;padding:15px 10px}
  .gm-nav .btn[disabled]{pointer-events:none}
  .gm-dots{display:flex;flex-wrap:wrap;gap:5px}
  .gm-dot{
    width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;
    font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);cursor:pointer;
  }
  .gm-dot.filled{background:var(--blue-soft);border-color:#BBD3EA;color:var(--navy)}
  .gm-dot.now{background:var(--navy);border-color:var(--navy);color:#fff}

  .s-hcp{background:#7F8DF0}
</style>

<div class="wrap">
  <header>
    <div class="dots"></div><div class="slash"></div>
    <div class="brand">Aq<span>Open</span></div>
    <div class="brand-sub">SWEDEN</div>
    <div class="brand-rule"></div>
    <div class="brand-note">Resultat &amp; poängräkning</div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="lb" aria-selected="true">Ställning</button>
    <button class="tab" role="tab" data-tab="spel" aria-selected="false">Spela</button>
    <button class="tab" role="tab" data-tab="bana" aria-selected="false">Bana</button>
    <button class="tab" role="tab" data-tab="sim" aria-selected="false">Simulator</button>
    <button class="tab" role="tab" data-tab="cfg" aria-selected="false">Inställningar</button>
  </nav>

  <main id="view"></main>
</div>
<div class="status" id="status">Laddar…</div>

<script>

  const HOLES = 18;
  const SCHEMA_VERSION = 2;
  const ROUND_IDS = ['bana', 'sim'];
  const ROUND_LABELS = {bana:'Bana (ute)', sim:'Simulator'};

  const clone = o => JSON.parse(JSON.stringify(o));
  const same = (a,b) => JSON.stringify(a)===JSON.stringify(b);
  const uid = () => Math.random().toString(36).slice(2,8);
  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
  const num = (v, fallback=0) => {
    const n = Number(v);
    return Number.isFinite(n) ? n : fallback;
  };

  const PRESET_LIBRARY = {
    aqopen: {
      presetId: 'aqopen',
      name: 'AqOpen Classic',
      stableford: { eaglePlus:12, birdie:6, par:3, bogey:2, double:1, triple:0 },
      bonuses: {
        ctp: { enabled:true, points:5, rounds:{bana:true, sim:true} },
        ld: { enabled:true, points:5, rounds:{bana:false, sim:true} },
        clean: { enabled:true, points:5, rounds:{bana:true, sim:true} },
        comeback: { enabled:true, points:10 }
      },
      handicap: {
        mode:'none',
        allowance:100,
        pointValue:1,
        appliesTo:'event'
      }
    },
    stableford: {
      presetId: 'stableford',
      name: 'Enkel Stableford',
      stableford: { eaglePlus:5, birdie:4, par:3, bogey:2, double:1, triple:0 },
      bonuses: {
        ctp: { enabled:false, points:3, rounds:{bana:true, sim:false} },
        ld: { enabled:false, points:3, rounds:{bana:false, sim:true} },
        clean: { enabled:false, points:3, rounds:{bana:true, sim:true} },
        comeback: { enabled:false, points:5 }
      },
      handicap: {
        mode:'none',
        allowance:100,
        pointValue:1,
        appliesTo:'event'
      }
    }
  };

  function presetConfig(id='aqopen'){
    return clone(PRESET_LIBRARY[id] || PRESET_LIBRARY.aqopen);
  }

  function touchGamemode(){
    if(!S.gamemode) S.gamemode = presetConfig('aqopen');
    if(S.gamemode.presetId !== 'custom'){
      S.gamemode.presetId = 'custom';
      S.gamemode.name = S.gamemode.name || 'Eget upplägg';
    }
  }

  function makePlayer(name){
    return {id:uid(), name, handicap:0};
  }

  function defaultState(){
    const pars = [4,4,3,5,4,4,3,4,5,4,3,4,5,4,4,3,4,5];
    const names = ['Spelare 1','Spelare 2','Spelare 3','Spelare 4'];
    return {
      v: SCHEMA_VERSION,
      event:'AqOpen Sweden',
      players: names.map(makePlayer),
      rounds:{
        bana:{label:'Bana (ute)', courseName:'', pars:[...pars], ctp:[3,12], ld:[]},
        sim: {label:'Simulator',  courseName:'', pars:[...pars], ctp:[7,16], ld:[5,14]}
      },
      gamemode: presetConfig('aqopen'),
      live: null,
      customCourses: [],
      strokes:{bana:{}, sim:{}},
      ctpWins:{bana:{}, sim:{}},
      ldWins:{sim:{}}
    };
  }

  function sanitizePlayers(players){
    if(!Array.isArray(players)) return [];
    return players.map((p, i)=>({
      id: typeof p?.id === 'string' && p.id ? p.id : uid(),
      name: typeof p?.name === 'string' && p.name.trim() ? p.name.trim() : 'Spelare '+(i+1),
      handicap: clamp(num(p?.handicap, 0), -36, 54)
    }));
  }

  function sanitizeRound(round, fallback){
    const src = round && typeof round === 'object' ? round : {};
    const pars = Array.isArray(src.pars) ? src.pars : fallback.pars;
    return {
      label: typeof src.label === 'string' && src.label.trim() ? src.label.trim() : fallback.label,
      courseName: typeof src.courseName === 'string' ? src.courseName : '',
      pars: Array.from({length:HOLES}, (_,i)=> clamp(num(pars[i], fallback.pars[i] || 4), 3, 6)),
      ctp: Array.isArray(src.ctp) ? src.ctp.map(v=>clamp(parseInt(v,10)||0,1,HOLES)).filter(Boolean) : [...fallback.ctp],
      ld: Array.isArray(src.ld) ? src.ld.map(v=>clamp(parseInt(v,10)||0,1,HOLES)).filter(Boolean) : [...fallback.ld]
    };
  }

  function sanitizeStrokeBucket(bucket, players){
    const out = {};
    players.forEach(p=>{
      const src = Array.isArray(bucket?.[p.id]) ? bucket[p.id] : [];
      out[p.id] = Array.from({length:HOLES}, (_,i)=>{
        const v = parseInt(src[i], 10);
        return Number.isFinite(v) ? clamp(v, 1, 20) : null;
      });
    });
    return out;
  }

  function sanitizeWinnerMap(map, players){
    const valid = new Set(players.map(p=>p.id));
    const out = {};
    Object.entries(map || {}).forEach(([hole, ids])=>{
      const h = parseInt(hole, 10);
      if(!(h>=1 && h<=HOLES)) return;
      const clean = [...new Set((Array.isArray(ids) ? ids : []).filter(id=>valid.has(id)))];
      if(clean.length) out[h] = clean;
    });
    return out;
  }

  function normalizeGamemode(raw){
    const src = raw && typeof raw === 'object' ? raw : {};
    const presetId = typeof src.presetId === 'string' && PRESET_LIBRARY[src.presetId] ? src.presetId : 'aqopen';
    const gm = presetConfig(presetId);
    if(typeof src.name === 'string' && src.name.trim()) gm.name = src.name.trim();
    const table = src.stableford || {};
    Object.keys(gm.stableford).forEach(k=>{
      gm.stableford[k] = clamp(num(table[k], gm.stableford[k]), -20, 50);
    });
    const bonuses = src.bonuses || {};
    ['ctp','ld','clean'].forEach(key=>{
      const current = bonuses[key] || {};
      gm.bonuses[key].enabled = current.enabled == null ? gm.bonuses[key].enabled : !!current.enabled;
      gm.bonuses[key].points = clamp(num(current.points, gm.bonuses[key].points), -50, 50);
      const rounds = current.rounds || {};
      gm.bonuses[key].rounds = {
        bana: rounds.bana == null ? gm.bonuses[key].rounds.bana : !!rounds.bana,
        sim: rounds.sim == null ? gm.bonuses[key].rounds.sim : !!rounds.sim
      };
    });
    gm.bonuses.comeback.enabled = bonuses.comeback?.enabled == null ? gm.bonuses.comeback.enabled : !!bonuses.comeback.enabled;
    gm.bonuses.comeback.points = clamp(num(bonuses.comeback?.points, gm.bonuses.comeback.points), -50, 50);
    const handicap = src.handicap || {};
    const mode = ['none','flat','allowance'].includes(handicap.mode) ? handicap.mode : gm.handicap.mode;
    const appliesTo = ['event','bana','sim','both'].includes(handicap.appliesTo) ? handicap.appliesTo : gm.handicap.appliesTo;
    gm.handicap = {
      mode,
      allowance: clamp(num(handicap.allowance, gm.handicap.allowance), 0, 200),
      pointValue: clamp(num(handicap.pointValue, gm.handicap.pointValue), -10, 10),
      appliesTo
    };
    if(src.presetId === 'custom' || !PRESET_LIBRARY[src.presetId]) gm.presetId = 'custom';
    return gm;
  }

  function sanitizeCourses(courses){
    if(!Array.isArray(courses)) return [];
    return courses
      .filter(c=>c && typeof c.name === 'string' && c.name.trim() && Array.isArray(c.pars) && c.pars.length === HOLES)
      .map(c=>({name:c.name.trim(), pars:c.pars.map(v=>clamp(num(v,4),3,6))}));
  }

  function migrateState(raw){
    const base = defaultState();
    const src = raw && typeof raw === 'object' ? raw : {};
    const players = sanitizePlayers(src.players);
    const state = {
      v: SCHEMA_VERSION,
      event: typeof src.event === 'string' && src.event.trim() ? src.event.trim() : base.event,
      players: players.length ? players : base.players,
      rounds: {
        bana: sanitizeRound(src.rounds?.bana, base.rounds.bana),
        sim: sanitizeRound(src.rounds?.sim, base.rounds.sim)
      },
      gamemode: normalizeGamemode(src.gamemode),
      live: src.live && ROUND_IDS.includes(src.live.round)
        ? { round: src.live.round, hole: clamp(parseInt(src.live.hole, 10) || 1, 1, HOLES) }
        : null,
      customCourses: sanitizeCourses(src.customCourses),
      strokes: {
        bana: sanitizeStrokeBucket(src.strokes?.bana, players.length ? players : base.players),
        sim: sanitizeStrokeBucket(src.strokes?.sim, players.length ? players : base.players)
      },
      ctpWins: {
        bana: sanitizeWinnerMap(src.ctpWins?.bana, players.length ? players : base.players),
        sim: sanitizeWinnerMap(src.ctpWins?.sim, players.length ? players : base.players)
      },
      ldWins: {
        sim: sanitizeWinnerMap(src.ldWins?.sim, players.length ? players : base.players)
      }
    };
    fixHoleChoicesState(state, 'bana');
    fixHoleChoicesState(state, 'sim');
    return state;
  }

  function gm(){
    return S.gamemode || presetConfig('aqopen');
  }

  function ruleCfg(key){
    return gm().bonuses[key];
  }

  function ruleEnabled(key, rid){
    const rule = ruleCfg(key);
    if(!rule || !rule.enabled) return false;
    if(rid == null) return true;
    if(!rule.rounds) return true;
    return !!rule.rounds[rid];
  }

  function handicapModeLabel(mode){
    return ({none:'Ingen', flat:'Fast bonus', allowance:'Procentuell'}[mode] || 'Ingen');
  }

  function handicapAppliesLabel(appliesTo){
    return ({event:'Totalt', both:'Båda ronderna', bana:'Bana', sim:'Simulator'}[appliesTo] || 'Totalt');
  }

  function stablefordSummary(mode = gm()){
    const m = mode.stableford;
    return [
      'Eagle+ '+fmt(m.eaglePlus),
      'Birdie '+fmt(m.birdie),
      'Par '+fmt(m.par),
      'Bogey '+fmt(m.bogey),
      'Dubbel '+fmt(m.double),
      'Trippel+ '+fmt(m.triple)
    ].join(' · ');
  }

  function gamemodeLines(mode = gm()){
    const lines = [
      'Stableford: '+stablefordSummary(mode)+'.'
    ];
    if(ruleEnabled('ctp')){
      const c = ruleCfg('ctp');
      const rounds = ROUND_IDS.filter(rid=>c.rounds[rid]).map(rid=>ROUND_LABELS[rid]).join(', ');
      lines.push('Closest to pin: '+fmt(c.points)+' poäng på '+rounds.toLowerCase()+'.');
    }
    if(ruleEnabled('ld')){
      const l = ruleCfg('ld');
      lines.push('Längsta drive: '+fmt(l.points)+' poäng på simulatorhål.');
    }
    if(ruleEnabled('clean')){
      const cl = ruleCfg('clean');
      const rounds = ROUND_IDS.filter(rid=>cl.rounds[rid]).map(rid=>ROUND_LABELS[rid]).join(', ');
      lines.push('Ren rond: '+fmt(cl.points)+' poäng på '+rounds.toLowerCase()+'.');
    }
    if(ruleEnabled('comeback')){
      lines.push('Comeback: '+fmt(ruleCfg('comeback').points)+' poäng till största förbättringen.');
    }
    const hc = mode.handicap;
    if(hc.mode !== 'none'){
      const detail = hc.mode === 'flat'
        ? 'handicap × '+fmt(hc.pointValue)
        : 'handicap × '+fmt(hc.allowance/100).replace('.', ',')+' × '+fmt(hc.pointValue);
      lines.push('Handicap: '+detail+' på '+handicapAppliesLabel(hc.appliesTo).toLowerCase()+'.');
    } else {
      lines.push('Handicap: avstängt.');
    }
    return lines;
  }

  /* Banbibliotek. courses.json ligger i repot och kan utökas med en push.
     Egna banor sparade i appen ligger i S.customCourses och delas med alla. */
  const BUILTIN_COURSES = [
    {name:'Standard par 72', pars:[4,4,3,5,4,4,3,4,5,4,3,4,5,4,4,3,4,5]},
    {name:'Standard par 71', pars:[4,4,3,5,4,4,3,4,4,4,3,4,5,4,4,3,4,5]},
    {name:'Standard par 70', pars:[4,4,3,5,4,4,3,4,4,4,3,4,4,4,4,3,4,5]}
  ];
  let COURSES = BUILTIN_COURSES.slice();
  async function loadCourses(){
    try{
      const r = await fetch('courses.json', {cache:'no-store'});
      if(!r.ok) throw new Error(r.status);
      const d = await r.json();
      if(Array.isArray(d.courses) && d.courses.length){
        COURSES = d.courses.filter(c=>Array.isArray(c.pars) && c.pars.length===HOLES);
      }
    }catch(e){}
  }
  const allCourses = () => COURSES.concat((S.customCourses||[]).map(c=>({...c, own:true})));

  let S = migrateState(defaultState());
  let tab = 'lb';
  let activePlayer = {bana:null, sim:null};

  const API = '/api/state';
  const LOCAL_KEY = 'aqopen-state-v2';
  const POLL_MS = 6000;

  let rev = 0;
  let base = null;
  let offline = false;
  let saveTimer = null, inFlight = false, dirty = false;

  function setStatus(txt, strong){
    document.getElementById('status').innerHTML = strong ? '<b>'+txt+'</b>' : txt;
  }
  let lastError = '';
  function syncedNote(){
    if(!offline) return 'Sparat · alla som öppnar sidan ser samma resultat';
    return 'Servern svarar inte'+(lastError?' ('+lastError+')':'')+' · sparat på den här telefonen så länge';
  }

  function merge(base, local, server){
    if(base===undefined) base = null;
    if(same(local, server)) return clone(local);
    if(Array.isArray(local) && Array.isArray(server)){
      if(Array.isArray(base) && local.length===server.length && base.length===local.length){
        return local.map((v,i)=>merge(base[i], v, server[i]));
      }
      return same(local, base) ? clone(server) : clone(local);
    }
    const plain = v => v && typeof v==='object' && !Array.isArray(v);
    if(plain(local) && plain(server)){
      const out = {};
      const b = plain(base) ? base : {};
      new Set([...Object.keys(local), ...Object.keys(server)]).forEach(k=>{
        const inL = k in local, inS = k in server, inB = k in b;
        if(inL && inS) out[k] = merge(b[k], local[k], server[k]);
        else if(inL){ if(!inB || !same(local[k], b[k])) out[k] = clone(local[k]); }
        else if(inS){ if(!inB) out[k] = clone(server[k]); }
      });
      return out;
    }
    return same(local, base) ? clone(server) : clone(local);
  }

  function applyServer(doc){
    const incoming = doc.state ? migrateState(doc.state) : null;
    if(!incoming){ rev = doc.rev; base = clone(S); return false; }
    const merged = base ? migrateState(merge(base, S, incoming)) : incoming;
    const changed = !same(merged, S);
    S = merged;
    base = clone(incoming);
    rev = doc.rev;
    if(!same(S, incoming)) queueSave();
    return changed;
  }

  async function pull(){
    const r = await fetch(API, {cache:'no-store'});
    if(!r.ok) throw new Error('GET '+r.status);
    lastError = '';
    return r.json();
  }
  async function push(){
    const r = await fetch(API, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rev, state:S})
    });
    if(r.status===409) return {conflict:true, doc: await r.json()};
    if(!r.ok) throw new Error('PUT '+r.status);
    return {conflict:false, doc: await r.json()};
  }

  async function flush(){
    saveTimer = null;
    if(inFlight) { dirty = true; return; }
    inFlight = true; dirty = false;
    localStorage.setItem(LOCAL_KEY, JSON.stringify({rev, state:S}));
    try{
      let res = await push();
      if(res.conflict){
        applyServer(res.doc);
        res = await push();
        if(res.conflict) dirty = true;
      }
      if(!res.conflict){ rev = res.doc.rev; base = clone(S); }
      offline = false;
      setStatus(syncedNote());
      render();
    }catch(e){
      offline = true; lastError = e.message;
      setStatus(syncedNote());
    }finally{
      inFlight = false;
      if(dirty) queueSave();
    }
  }
  function queueSave(){
    clearTimeout(saveTimer);
    if(!offline) setStatus('Sparar…');
    saveTimer = setTimeout(flush, 500);
  }
  const save = queueSave;

  async function poll(){
    if(inFlight || saveTimer) return;
    try{
      const doc = await pull();
      offline = false;
      if(doc.rev !== rev){
        const changed = applyServer(doc);
        setStatus(syncedNote());
        if(changed) render();
      }
    }catch(e){
      if(!offline){ offline = true; lastError = e.message; setStatus(syncedNote()); }
    }
  }

  async function load(){
    await loadCourses();
    const cached = localStorage.getItem(LOCAL_KEY) || localStorage.getItem('aqopen-state-v1');
    if(cached){
      try{
        const c = JSON.parse(cached);
        S = migrateState(c.state || {});
        rev = c.rev || 0;
        base = clone(S);
      }catch(e){}
    }
    try{
      const doc = await pull();
      applyServer(doc);
      if(!doc.state) queueSave();
      setStatus(syncedNote());
    }catch(e){
      offline = true; lastError = e.message;
      setStatus(syncedNote());
    }
    render();
    setInterval(poll, POLL_MS);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) poll(); });
  }

  function holePoints(strokes, par, mode = gm()){
    if(strokes==null) return null;
    const d = strokes - par;
    if(d<=-2) return mode.stableford.eaglePlus;
    if(d===-1) return mode.stableford.birdie;
    if(d===0) return mode.stableford.par;
    if(d===1) return mode.stableford.bogey;
    if(d===2) return mode.stableford.double;
    return mode.stableford.triple;
  }
  function holeLabel(strokes, par){
    if(strokes==null) return '';
    const d = strokes - par;
    if(d<=-2) return 'Eagle+';
    if(d===-1) return 'Birdie';
    if(d===0) return 'Par';
    if(d===1) return 'Bogey';
    if(d===2) return 'Dubbel';
    return 'Trippel+';
  }
  function arr(roundId, pid){
    const r = S.strokes[roundId] || (S.strokes[roundId]={});
    if(!r[pid]) r[pid] = new Array(HOLES).fill(null);
    if(r[pid].length!==HOLES) r[pid] = r[pid].concat(new Array(HOLES).fill(null)).slice(0,HOLES);
    return r[pid];
  }
  function roundStable(roundId, pid){
    const a = arr(roundId,pid), pars = S.rounds[roundId].pars;
    let sum=0, filled=0, clean=true;
    for(let i=0;i<HOLES;i++){
      if(a[i]==null) continue;
      filled++;
      sum += holePoints(a[i], pars[i]);
      if(a[i]-pars[i] >= 3) clean = false;
    }
    return {sum, filled, complete: filled===HOLES, clean};
  }
  function splitPoints(winners, total){
    const out = {};
    if(!winners || !winners.length) return out;
    const each = total / winners.length;
    winners.forEach(p => out[p] = (out[p]||0) + each);
    return out;
  }
  function playerHandicap(player){
    return clamp(num(player?.handicap, 0), -36, 54);
  }
  function handicapRoundBonus(player, rid, stats){
    const cfg = gm().handicap;
    if(cfg.mode==='none') return 0;
    if(cfg.appliesTo==='event') return 0;
    if(cfg.appliesTo!=='both' && cfg.appliesTo!==rid) return 0;
    if(!stats?.filled) return 0;
    const hcp = playerHandicap(player);
    if(!hcp) return 0;
    const basePoints = cfg.mode==='flat' ? hcp : hcp * (cfg.allowance / 100);
    return basePoints * cfg.pointValue;
  }
  function handicapEventBonus(player, roundStats){
    const cfg = gm().handicap;
    if(cfg.mode==='none' || cfg.appliesTo!=='event') return 0;
    const totalFilled = ROUND_IDS.reduce((n, rid)=>n + (roundStats[rid]?.filled || 0), 0);
    if(!totalFilled) return 0;
    const hcp = playerHandicap(player);
    if(!hcp) return 0;
    const basePoints = cfg.mode==='flat' ? hcp : hcp * (cfg.allowance / 100);
    return basePoints * cfg.pointValue;
  }
  function rulePrizeLabel(key){
    return ({ctp:'Closest to pin', ld:'Längsta drive', clean:'Ren rond', comeback:'Comeback'}[key] || key);
  }
  function compute(){
    const res = {};
    const stats = {bana:{}, sim:{}};
    S.players.forEach(p=>{
      stats.bana[p.id] = roundStable('bana', p.id);
      stats.sim[p.id] = roundStable('sim', p.id);
      res[p.id] = {
        stableBana:stats.bana[p.id].sum,
        stableSim:stats.sim[p.id].sum,
        ctp:0, ld:0, tri:0, cb:0, hcpBana:0, hcpSim:0, hcpEvent:0, hcp:0, total:0,
        cleanBana:false, cleanSim:false, delta:null, badges:[]
      };
    });

    S.players.forEach(p=>{
      const b = stats.bana[p.id], s = stats.sim[p.id], r = res[p.id];
      if(ruleEnabled('clean', 'bana') && b.complete && b.clean){ r.tri += ruleCfg('clean').points; r.cleanBana = true; }
      if(ruleEnabled('clean', 'sim') && s.complete && s.clean){ r.tri += ruleCfg('clean').points; r.cleanSim = true; }
      if(b.complete && s.complete) r.delta = s.sum - b.sum;
      r.hcpBana = handicapRoundBonus(p, 'bana', b);
      r.hcpSim = handicapRoundBonus(p, 'sim', s);
      r.hcpEvent = handicapEventBonus(p, {bana:b, sim:s});
      r.hcp = r.hcpBana + r.hcpSim + r.hcpEvent;
    });

    if(ruleEnabled('ctp')){
      ['bana','sim'].forEach(rid=>{
        if(!ruleEnabled('ctp', rid)) return;
        const wins = S.ctpWins[rid] || {};
        Object.keys(wins).forEach(h=>{
          const add = splitPoints(wins[h], ruleCfg('ctp').points);
          Object.keys(add).forEach(pid=>{ if(res[pid]) res[pid].ctp += add[pid]; });
        });
      });
    }
    if(ruleEnabled('ld', 'sim')){
      const wins = S.ldWins.sim || {};
      Object.keys(wins).forEach(h=>{
        const add = splitPoints(wins[h], ruleCfg('ld').points);
        Object.keys(add).forEach(pid=>{ if(res[pid]) res[pid].ld += add[pid]; });
      });
    }
    if(ruleEnabled('comeback')){
      const eligible = S.players.filter(p=>res[p.id].delta!=null && res[p.id].delta>0);
      if(eligible.length){
        const best = Math.max(...eligible.map(p=>res[p.id].delta));
        const winners = eligible.filter(p=>res[p.id].delta===best).map(p=>p.id);
        const add = splitPoints(winners, ruleCfg('comeback').points);
        Object.keys(add).forEach(pid=>{ res[pid].cb += add[pid]; });
      }
    }

    S.players.forEach(p=>{
      const b = arr('bana',p.id), sm = arr('sim',p.id);
      let db=0, ds=0, n=0;
      for(let i=0;i<HOLES;i++){
        if(b[i]!=null && sm[i]!=null){
          db += holePoints(b[i], S.rounds.bana.pars[i]);
          ds += holePoints(sm[i], S.rounds.sim.pars[i]);
          n++;
        }
      }
      res[p.id].live = {holes:n, delta: n ? ds-db : null, bana:db, sim:ds};
      res[p.id].total = res[p.id].stableBana + res[p.id].stableSim + res[p.id].ctp + res[p.id].ld + res[p.id].tri + res[p.id].cb + res[p.id].hcp;
    });

    const comebackLead = Math.max(0, ...S.players.map(p=>res[p.id].cb));
    S.players.forEach(p=>{
      const r = res[p.id];
      if(r.cleanBana || r.cleanSim) r.badges.push('Ren rond');
      if(r.hcp) r.badges.push('HCP '+(r.hcp>0?'+':'')+fmt(r.hcp));
      if(comebackLead>0 && r.cb===comebackLead) r.badges.push('Comeback-ledare');
    });
    return res;
  }
  const fmt = n => (Math.round(num(n,0)*10)/10).toString().replace('.', ',');

  const el = (h)=>{const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild;};
  const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function render(){
    const v = document.getElementById('view');
    v.innerHTML = '';
    document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', String(t.dataset.tab===tab)));
    if(tab==='lb') v.appendChild(renderLeaderboard());
    else if(tab==='spel') v.appendChild(renderGame());
    else if(tab==='cfg') v.appendChild(renderConfig());
    else v.appendChild(renderRound(tab));
    window.scrollTo({top:0, behavior:'instant'});
  }

  function prizeLeaders(res, pick){
    const vals = S.players.map(p=>({p, v:pick(res[p.id])})).filter(x=>x.v>0);
    const best = vals.length ? Math.max(...vals.map(x=>x.v)) : 0;
    return {
      best,
      who: vals.filter(x=>x.v===best).map(x=>x.p.name)
    };
  }

    rows.forEach(([label, pick])=>{

  function renderRound(rid){
    const R = S.rounds[rid];
    const box = el('<div></div>');
    if(!S.players.length){
      box.appendChild(el('<section class="card"><div class="card-body"><p class="empty-note">Lägg till spelare under Inställningar först.</p></div></section>'));
      return box;
    }
    if(!activePlayer[rid] || !S.players.some(p=>p.id===activePlayer[rid])) activePlayer[rid]=S.players[0].id;
    const pid = activePlayer[rid];
    const player = S.players.find(p=>p.id===pid);

    const pick = el('<section class="card"><div class="card-head">'+esc(R.label)+'</div><div class="card-body"><h3 class="sec">Spelare</h3><div class="chips" id="pp"></div></div></section>');
    const pp = pick.querySelector('#pp');
    S.players.forEach(p=>{
      const c = el('<button class="chip" aria-pressed="'+(p.id===pid)+'">'+esc(p.name)+(p.handicap?' · HCP '+fmt(p.handicap):'')+'</button>');
      c.onclick = ()=>{ activePlayer[rid]=p.id; render(); };
      pp.appendChild(c);
    });
    box.appendChild(pick);

    const st = roundStable(rid,pid);
    const hcpRound = handicapRoundBonus(player, rid, st);
    const sc = el('<section class="card"><div class="card-head light">Scorekort<span style="font-family:\'IBM Plex Mono\',monospace;font-size:13px">'+st.sum+' p'+(hcpRound?' · HCP '+fmt(hcpRound):'')+'</span></div><div class="card-body"><table class="holes"><thead><tr><th>Hål</th><th>Par</th><th></th><th style="text-align:right">Slag</th><th style="text-align:right">Resultat</th></tr></thead><tbody id="tb"></tbody></table></div></section>');
    const tb = sc.querySelector('#tb');
    const a = arr(rid,pid);
    let strokeSum = 0;
    for(let i=0;i<HOLES;i++){
      const par = R.pars[i], v = a[i];
      if(v!=null) strokeSum += v;
      const pts = holePoints(v,par);
      const lab = holeLabel(v,par);
      const isTri = v!=null && (v-par)>=3;
      const tags = (ruleEnabled('ctp', rid) && R.ctp.includes(i+1)?'<span class="tag">CTP</span>':'') + (ruleEnabled('ld','sim') && rid==='sim'&&R.ld.includes(i+1)?'<span class="tag">LD</span>':'');
      const tr = el('<tr'+(v!=null?' class="done"':'')+'>'+ 
        '<td class="hno">'+(i+1)+'</td>'+
        '<td class="par">Par '+par+'</td>'+
        '<td class="tags">'+tags+'</td>'+
        '<td><div class="stepper">'+
          '<button aria-label="Ett slag mindre">−</button>'+
          '<input class="strokes'+(v==null?' empty':'')+'" inputmode="numeric" value="'+(v==null?'–':v)+'">'+
          '<button aria-label="Ett slag mer">+</button>'+
        '</div></td>'+
        '<td class="res'+(isTri?' tri':'')+'">'+(v==null?'<span style="color:#B7C2D0">–</span>':lab+' <b>'+pts+'</b>')+'</td>'+
      '</tr>');
      const [minus, plus] = tr.querySelectorAll('.stepper button');
      const input = tr.querySelector('.strokes');
      const setVal = (nv)=>{ a[i] = nv; save(); render(); };
      minus.onclick = ()=> setVal(a[i]==null ? par : Math.max(1, a[i]-1));
      plus.onclick  = ()=> setVal(a[i]==null ? par : Math.min(20, a[i]+1));
      input.onfocus = e=>{ if(a[i]==null) e.target.value=''; e.target.select(); };
      input.onblur = e=>{
        const raw = e.target.value.trim();
        if(raw===''||raw==='–'){ setVal(null); return; }
        const n = parseInt(raw,10);
        setVal(isNaN(n)?null:Math.min(20,Math.max(1,n)));
      };
      input.onkeydown = e=>{ if(e.key==='Enter') e.target.blur(); };
      tb.appendChild(tr);
    }
    tb.appendChild(el('<tr class="totrow"><td colspan="3">Totalt</td><td style="text-align:right;font-family:\'IBM Plex Mono\',monospace">'+(strokeSum||'–')+'</td><td class="res"><b>'+fmt(st.sum + hcpRound)+' p</b></td></tr>'));
    const cleanText = ruleEnabled('clean', rid)
      ? (st.clean ? 'Ronden klar utan trippelbogey: +'+fmt(ruleCfg('clean').points)+' poäng.' : 'Ronden klar. Trippelbogey eller sämre noterad, ingen bonus.')
      : 'Ronden klar.';
    const cleanNote = st.complete
      ? '<p class="empty-note" style="margin:10px 0 0'+(st.clean&&ruleEnabled('clean', rid)?';color:var(--blue)':'')+'">'+cleanText+'</p>'
      : '<p class="empty-note" style="margin:10px 0 0">'+st.filled+' av 18 hål ifyllda.</p>';
    sc.querySelector('.card-body').appendChild(el(cleanNote));
    if(hcpRound) sc.querySelector('.card-body').appendChild(el('<p class="empty-note" style="margin:8px 0 0">Handicap i den här ronden: '+fmt(hcpRound)+' p.</p>'));
    box.appendChild(sc);

    if(ruleEnabled('ctp', rid)){
      const ctp = el('<section class="card"><div class="card-head light">Closest to pin</div><div class="card-body" id="cb"></div></section>');
      const cb = ctp.querySelector('#cb');
      cb.appendChild(el('<p class="empty-note" style="margin:0 0 10px">Markera den som ligger närmast hål. Flera markerade delar på '+fmt(ruleCfg('ctp').points)+' poäng.</p>'));
      if(!R.ctp.length) cb.appendChild(el('<p class="empty-note">Inga CTP-hål valda för den här ronden. Välj dem under Inställningar.</p>'));
      R.ctp.forEach(h=>{
        const wrap = el('<div class="subcard"><h4>Hål '+h+' <span style="font-weight:400;color:var(--muted);font-size:12.5px">· par '+R.pars[h-1]+'</span></h4><div class="chips" id="c'+h+'"></div></div>');
        const row = wrap.querySelector('#c'+h);
        const cur = (S.ctpWins[rid][h]||[]);
        S.players.forEach(p=>{
          const on = cur.includes(p.id);
          const c = el('<button class="chip blue" aria-pressed="'+on+'">'+esc(p.name)+'</button>');
          c.onclick = ()=>{
            const list = new Set(S.ctpWins[rid][h]||[]);
            list.has(p.id) ? list.delete(p.id) : list.add(p.id);
            S.ctpWins[rid][h] = [...list];
            if(!S.ctpWins[rid][h].length) delete S.ctpWins[rid][h];
            save(); render();
          };
          row.appendChild(c);
        });
        if(cur.length) wrap.appendChild(el('<p class="empty-note" style="margin:8px 0 0">'+fmt(ruleCfg('ctp').points/cur.length)+' poäng var.</p>'));
        cb.appendChild(wrap);
      });
      box.appendChild(ctp);
    }

    if(rid==='sim' && ruleEnabled('ld', 'sim')){
      const ld = el('<section class="card"><div class="card-head light">Längsta drive</div><div class="card-body" id="ldb"></div></section>');
      const ldb = ld.querySelector('#ldb');
      ldb.appendChild(el('<p class="empty-note" style="margin:0 0 10px">Slaget måste landa på fairway. '+fmt(ruleCfg('ld').points)+' poäng per hål, delas vid lika.</p>'));
      if(!R.ld.length) ldb.appendChild(el('<p class="empty-note">Inga drivehål valda. Välj dem under Inställningar.</p>'));
      R.ld.forEach(h=>{
        const wrap = el('<div class="subcard"><h4>Hål '+h+'</h4><div class="chips" id="ld'+h+'"></div></div>');
        const row = wrap.querySelector('#ld'+h);
        const cur = (S.ldWins.sim[h]||[]);
        S.players.forEach(p=>{
          const on = cur.includes(p.id);
          const c = el('<button class="chip blue" aria-pressed="'+on+'">'+esc(p.name)+'</button>');
          c.onclick = ()=>{
            const list = new Set(S.ldWins.sim[h]||[]);
            list.has(p.id) ? list.delete(p.id) : list.add(p.id);
            S.ldWins.sim[h] = [...list];
            if(!S.ldWins.sim[h].length) delete S.ldWins.sim[h];
            save(); render();
          };
          row.appendChild(c);
        });
        if(cur.length) wrap.appendChild(el('<p class="empty-note" style="margin:8px 0 0">'+fmt(ruleCfg('ld').points/cur.length)+' poäng var.</p>'));
        ldb.appendChild(wrap);
      });
      box.appendChild(ld);
    }
    return box;
  }

  function fixHoleChoicesState(state, rid){
    const R = state.rounds[rid];
    const par3 = R.pars.map((p,i)=>({p,h:i+1})).filter(x=>x.p===3).map(x=>x.h);
    R.ctp = [...new Set(R.ctp.filter(h=>par3.includes(h)))];
    par3.forEach(h=>{ if(R.ctp.length<2 && !R.ctp.includes(h)) R.ctp.push(h); });
    R.ctp.sort((a,b)=>a-b);
    if(rid==='sim'){
      const long = R.pars.map((p,i)=>({p,h:i+1})).filter(x=>x.p>=4);
      R.ld = [...new Set(R.ld.filter(h=>long.some(x=>x.h===h)))];
      long.filter(x=>x.p===5).forEach(x=>{ if(R.ld.length<2 && !R.ld.includes(x.h)) R.ld.push(x.h); });
      R.ld.sort((a,b)=>a-b);
    }
    Object.keys(state.ctpWins[rid]).forEach(h=>{ if(!R.ctp.includes(+h)) delete state.ctpWins[rid][h]; });
    if(rid==='sim') Object.keys(state.ldWins.sim).forEach(h=>{ if(!R.ld.includes(+h)) delete state.ldWins.sim[h]; });
  }
  function fixHoleChoices(rid){
    fixHoleChoicesState(S, rid);
  }
  function applyCourse(rid, course){
    if(!course) return;
    const R = S.rounds[rid];
    R.pars = [...course.pars];
    R.courseName = course.name;
    fixHoleChoices(rid);
    save();
  }

  function firstOpenHole(rid){
    for(let i=0;i<HOLES;i++) if(S.players.some(p=>arr(rid,p.id)[i]==null)) return i+1;
    return HOLES;
  }
  function winnerChips(list, onToggle, points){
    const row = el('<div class="chips"></div>');
    S.players.forEach(p=>{
      const on = list.includes(p.id);
      const c = el('<button class="chip blue" aria-pressed="'+on+'">'+esc(p.name)+'</button>');
      c.onclick = ()=>onToggle(p.id);
      row.appendChild(c);
    });
    if(list.length>1) row.appendChild(el('<span class="empty-note" style="align-self:center">'+fmt(points/list.length)+' p var</span>'));
    return row;
  }

  function renderGame(){
    const box = el('<div></div>');
    if(!S.players.length){
      box.appendChild(el('<section class="card"><div class="card-body"><p class="empty-note">Lägg till spelare under Inställningar först.</p></div></section>'));
      return box;
    }

    if(!S.live){
      const c = el('<section class="card"><div class="card-head">Spelläge</div><div class="card-body" id="gs"></div></section>');
      const gs = c.querySelector('#gs');
      gs.appendChild(el('<p class="empty-note" style="margin:0 0 12px">Ett hål i taget, alla spelarna på samma skärm. Alla telefoner följer samma hål. Aktivt format: '+esc(gm().name)+'.</p>'));
      ['bana','sim'].forEach(rid=>{
        const R = S.rounds[rid];
        const filled = S.players.reduce((n,p)=>n+arr(rid,p.id).filter(v=>v!=null).length,0);
        const of = S.players.length*HOLES;
        const started = filled>0;
        const activeBonuses = [];
        if(ruleEnabled('ctp', rid)) activeBonuses.push('CTP');
        if(rid==='sim' && ruleEnabled('ld', 'sim')) activeBonuses.push('LD');
        if(ruleEnabled('clean', rid)) activeBonuses.push('Ren rond');
        const b = el('<button class="btn" style="width:100%;margin-bottom:10px;padding:16px;text-align:left">'+
          (started?'Fortsätt ':'Starta ')+esc(R.label)+
          '<span style="display:block;font-family:Inter;letter-spacing:0;text-transform:none;font-size:12px;font-weight:400;opacity:.8;margin-top:4px">'+
          (R.courseName?esc(R.courseName)+' · ':'')+'par '+R.pars.reduce((a,b)=>a+b,0)+' · '+filled+'/'+of+' noteringar'+(activeBonuses.length?' · '+activeBonuses.join(', '):'')+'</span></button>');
        b.onclick = ()=>{ S.live = {round:rid, hole:firstOpenHole(rid)}; save(); render(); };
        gs.appendChild(b);
      });
      box.appendChild(c);
      return box;
    }

    const rid = S.live.round, R = S.rounds[rid];
    const h = clamp(S.live.hole, 1, HOLES), par = R.pars[h-1];
    const isCtp = ruleEnabled('ctp', rid) && R.ctp.includes(h);
    const isLd = ruleEnabled('ld', 'sim') && rid==='sim' && R.ld.includes(h);

    const head = el('<section class="card"><div class="card-head">'+esc(R.label)+
      '<span style="font-family:Inter;letter-spacing:0;text-transform:none;font-size:12px;font-weight:400;opacity:.8">Hål '+h+' av '+HOLES+'</span></div>'+
      '<div class="card-body"><div class="gm-hole"><div class="gm-num">'+h+'</div>'+
      '<div><div class="gm-par">Par '+par+'</div>'+
      (isCtp?'<span class="tag">CLOSEST TO PIN</span>':'')+(isLd?'<span class="tag">LÄNGSTA DRIVE</span>':'')+
      '</div></div><div id="gp"></div></div></section>');
    const gp = head.querySelector('#gp');

    S.players.forEach(p=>{
      const a = arr(rid,p.id), v = a[h-1];
      const row = el('<div class="gm-row">'+
        '<span class="gm-name">'+esc(p.name)+(p.handicap?' <span class="empty-note">HCP '+fmt(p.handicap)+'</span>':'')+'</span>'+
        '<span class="gm-pts">'+(v==null?'–':holeLabel(v,par)+' '+holePoints(v,par)+'p')+'</span>'+
        '<span class="stepper"><button aria-label="Ett slag mindre">−</button>'+
        '<input class="strokes'+(v==null?' empty':'')+'" inputmode="numeric" value="'+(v==null?'–':v)+'">'+
        '<button aria-label="Ett slag mer">+</button></span></div>');
      const [minus, plus] = row.querySelectorAll('.stepper button');
      const input = row.querySelector('.strokes');
      const set = nv => { a[h-1] = nv; save(); render(); };
      minus.onclick = ()=> set(a[h-1]==null ? par : Math.max(1, a[h-1]-1));
      plus.onclick  = ()=> set(a[h-1]==null ? par : Math.min(20, a[h-1]+1));
      input.onfocus = e=>{ if(a[h-1]==null) e.target.value=''; e.target.select(); };
      input.onblur = e=>{
        const raw = e.target.value.trim();
        if(raw===''||raw==='–') return set(null);
        const n = parseInt(raw,10);
        set(isNaN(n)?null:Math.min(20,Math.max(1,n)));
      };
      input.onkeydown = e=>{ if(e.key==='Enter') e.target.blur(); };
      gp.appendChild(row);
    });

    const stakes = el('<div class="subcard"><h4>Vad står på spel?</h4><p>'+esc(stablefordSummary())+'</p><div class="chips" id="stakes"></div></div>');
    const stakeRow = stakes.querySelector('#stakes');
    if(isCtp) stakeRow.appendChild(el('<span class="tag">CTP +'+fmt(ruleCfg('ctp').points)+' p</span>'));
    if(isLd) stakeRow.appendChild(el('<span class="tag">LD +'+fmt(ruleCfg('ld').points)+' p</span>'));
    if(ruleEnabled('clean', rid)) stakeRow.appendChild(el('<span class="tag">Ren rond +'+fmt(ruleCfg('clean').points)+' p</span>'));
    const hcfg = gm().handicap;
    if(hcfg.mode!=='none' && (hcfg.appliesTo==='event' || hcfg.appliesTo==='both' || hcfg.appliesTo===rid)){
      stakeRow.appendChild(el('<span class="tag">Handicap '+esc(handicapModeLabel(hcfg.mode))+'</span>'));
    }
    head.querySelector('.card-body').appendChild(stakes);

    if(isCtp){
      const cur = S.ctpWins[rid][h]||[];
      const w = el('<div class="subcard"><h4>Närmast hål</h4><p>'+fmt(ruleCfg('ctp').points)+' poäng, delas vid lika.</p></div>');
      w.appendChild(winnerChips(cur, pid=>{
        const l = new Set(S.ctpWins[rid][h]||[]);
        l.has(pid) ? l.delete(pid) : l.add(pid);
        S.ctpWins[rid][h] = [...l];
        if(!S.ctpWins[rid][h].length) delete S.ctpWins[rid][h];
        save(); render();
      }, ruleCfg('ctp').points));
      head.querySelector('.card-body').appendChild(w);
    }
    if(isLd){
      const cur = S.ldWins.sim[h]||[];
      const w = el('<div class="subcard"><h4>Längsta drive</h4><p>Måste landa på fairway. '+fmt(ruleCfg('ld').points)+' poäng, delas vid lika.</p></div>');
      w.appendChild(winnerChips(cur, pid=>{
        const l = new Set(S.ldWins.sim[h]||[]);
        l.has(pid) ? l.delete(pid) : l.add(pid);
        S.ldWins.sim[h] = [...l];
        if(!S.ldWins.sim[h].length) delete S.ldWins.sim[h];
        save(); render();
      }, ruleCfg('ld').points));
      head.querySelector('.card-body').appendChild(w);
    }

    const nav = el('<div class="gm-nav"></div>');
    const prev = el('<button class="btn ghost"'+(h===1?' disabled style="opacity:.4"':'')+'>← Hål '+(h-1)+'</button>');
    prev.onclick = ()=>{ if(h>1){ S.live.hole = h-1; save(); render(); } };
    const next = el('<button class="btn">'+(h===HOLES?'Avsluta ronden':'Nästa hål →')+'</button>');
    next.onclick = ()=>{
      if(h===HOLES){ S.live = null; tab='lb'; save(); render(); }
      else { S.live.hole = h+1; save(); render(); }
    };
    nav.appendChild(prev); nav.appendChild(next);
    head.querySelector('.card-body').appendChild(nav);

    const openHoles = S.players.some(p=>arr(rid,p.id)[h-1]==null);
    if(openHoles) head.querySelector('.card-body').appendChild(el('<p class="empty-note" style="margin:10px 0 0">Alla spelare är inte ifyllda på det här hålet.</p>'));
    box.appendChild(head);

    const dots = el('<section class="card"><div class="card-body"><h3 class="sec">Hoppa till hål</h3><div class="gm-dots" id="gd"></div></div></section>');
    const gd = dots.querySelector('#gd');
    for(let i=1;i<=HOLES;i++){
      const full = S.players.every(p=>arr(rid,p.id)[i-1]!=null);
      const d = el('<button class="gm-dot'+(full?' filled':'')+(i===h?' now':'')+'">'+i+'</button>');
      d.onclick = ()=>{ S.live.hole = i; save(); render(); };
      gd.appendChild(d);
    }
    const stop = el('<button class="btn ghost" style="width:100%;margin-top:12px">Lämna spelläget</button>');
    stop.onclick = ()=>{ S.live = null; save(); render(); };
    dots.querySelector('.card-body').appendChild(stop);
    box.appendChild(dots);

    const st = el('<section class="card"><div class="card-head light">Ställning i ronden</div><div class="card-body" id="gst"></div></section>');
    const gst = st.querySelector('#gst');
    [...S.players].map(p=>({p, r:roundStable(rid,p.id)})).sort((a,b)=>{
      const av = a.r.sum + handicapRoundBonus(a.p, rid, a.r);
      const bv = b.r.sum + handicapRoundBonus(b.p, rid, b.r);
      return bv-av;
    }).forEach(x=>{
      const hcp = handicapRoundBonus(x.p, rid, x.r);
      gst.appendChild(el('<div style="display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)">'+
        '<span>'+esc(x.p.name)+'</span><span><b style="font-family:\'IBM Plex Mono\',monospace">'+fmt(x.r.sum+hcp)+' p</b>'+
        '<span class="empty-note" style="margin-left:8px">'+x.r.filled+' hål'+(hcp?' · HCP '+fmt(hcp):'')+'</span></span></div>'));
    });
    box.appendChild(st);
    return box;
  }

    touchGamemode();
    S.gamemode.bonuses[rule].rounds[rid] = value;
    save(); render();
  }

      const toggle = card.querySelector('button');
      toggle.onclick = ()=>{ touchGamemode(); rule.enabled = !rule.enabled; save(); render(); };
      card.querySelector('input').onchange = e=>{ touchGamemode(); rule.points = clamp(num(e.target.value, 0), -50, 50); save(); render(); };

      if(rounds.length){
        rounds.forEach(rid=>{
          const chip = el('<button class="chip" aria-pressed="'+rule.rounds[rid]+'">'+ROUND_LABELS[rid]+'</button>');
          chip.onclick = ()=> setRoundFlag(key, rid, !rule.rounds[rid]);
          chips.appendChild(chip);
        });
      } else {
        chips.appendChild(el('<span class="empty-note">Jämför alltid bana mot simulator.</span>'));
      }
      bonusWrap.appendChild(card);
    });
    gb.appendChild(bonuses);

    const hc = gm().handicap;
    const hcCard = el('<div class="subcard"><h4>Handicap</h4><div class="field"><label>Modell</label><select id="hcMode"><option value="none">Ingen</option><option value="flat">Fast bonus</option><option value="allowance">Procentuell</option></select></div><div class="field"><label>Gäller</label><select id="hcApply"><option value="event">Totalt</option><option value="both">Båda ronderna</option><option value="bana">Bana</option><option value="sim">Simulator</option></select></div><div class="field"><label>Allowance</label><input id="hcAllow" type="number" value="'+hc.allowance+'"></div><div class="field"><label>Värde</label><input id="hcValue" type="number" step="0.5" value="'+hc.pointValue+'"></div><p class="empty-note" style="margin:8px 0 0">Fast bonus = handicap × värde. Procentuell = handicap × allowance × värde.</p></div>');
    hcCard.querySelector('#hcMode').value = hc.mode;
    hcCard.querySelector('#hcApply').value = hc.appliesTo;
    hcCard.querySelector('#hcMode').onchange = e=>{ touchGamemode(); S.gamemode.handicap.mode = e.target.value; save(); render(); };
    hcCard.querySelector('#hcApply').onchange = e=>{ touchGamemode(); S.gamemode.handicap.appliesTo = e.target.value; save(); render(); };
    hcCard.querySelector('#hcAllow').onchange = e=>{ touchGamemode(); S.gamemode.handicap.allowance = clamp(num(e.target.value, 100), 0, 200); save(); render(); };
    hcCard.querySelector('#hcValue').onchange = e=>{ touchGamemode(); S.gamemode.handicap.pointValue = clamp(num(e.target.value, 1), -10, 10); save(); render(); };
    gb.appendChild(hcCard);
    box.appendChild(gc);

    const pc = el('<section class="card"><div class="card-head">Spelare</div><div class="card-body" id="pl"></div></section>');
    const pl = pc.querySelector('#pl');
    S.players.forEach((p, i)=>{
      const f = el('<div class="subcard" style="margin-top:0;margin-bottom:8px"><div class="field"><label>Namn</label><input type="text" value="'+esc(p.name)+'"></div><div class="field"><label>Handicap</label><input type="number" step="0.5" value="'+p.handicap+'"><button class="btn danger" style="padding:8px 12px;white-space:nowrap">Ta bort</button></div></div>');
      const inp = f.querySelector('input[type=text]');
      const hcp = f.querySelector('input[type=number]');
      const del = f.querySelector('button');
      inp.onblur = ()=>{ p.name = inp.value.trim() || 'Spelare '+(i+1); save(); render(); };
      inp.onkeydown = e=>{ if(e.key==='Enter') e.target.blur(); };
      hcp.onchange = ()=>{ p.handicap = clamp(num(hcp.value, 0), -36, 54); save(); render(); };
      del.onclick = ()=>{
        S.players = S.players.filter(x=>x.id!==p.id);
        ['bana','sim'].forEach(r=>{ delete (S.strokes[r]||{})[p.id]; Object.keys(S.ctpWins[r]).forEach(h=>{ S.ctpWins[r][h]=S.ctpWins[r][h].filter(i=>i!==p.id); if(!S.ctpWins[r][h].length) delete S.ctpWins[r][h]; }); });
        Object.keys(S.ldWins.sim).forEach(h=>{ S.ldWins.sim[h]=S.ldWins.sim[h].filter(i=>i!==p.id); if(!S.ldWins.sim[h].length) delete S.ldWins.sim[h]; });
        save(); render();
      };
      pl.appendChild(f);
    });
    const add = el('<button class="btn ghost">+ Lägg till spelare</button>');
    add.onclick = ()=>{ S.players.push(makePlayer('Spelare '+(S.players.length+1))); save(); render(); };
    pl.appendChild(add);
    box.appendChild(pc);

    ['bana','sim'].forEach(rid=>{
      const R = S.rounds[rid];
      const total = R.pars.reduce((a,b)=>a+b,0);
      const c = el('<section class="card"><div class="card-head light">'+esc(R.label)+'<span style="font-family:\'IBM Plex Mono\',monospace;font-size:13px">Par '+total+'</span></div><div class="card-body" id="rb"></div></section>');
      const rb = c.querySelector('#rb');

      rb.appendChild(el('<h3 class="sec">Bana</h3>'));
      const list = allCourses();
      const sel = el('<select><option value="">Välj bana…</option></select>');
      list.forEach((course,ix)=>{
        const o = document.createElement('option');
        o.value = String(ix);
        o.textContent = course.name + (course.own?' (egen)':'') + ' · par ' + course.pars.reduce((a,b)=>a+b,0);
        if(course.name===R.courseName) o.selected = true;
        sel.appendChild(o);
      });
      const applyRow = el('<div class="field" style="align-items:stretch"></div>');
      applyRow.appendChild(sel);
      const useBtn = el('<button class="btn" style="white-space:nowrap">Använd</button>');
      useBtn.onclick = ()=>{ if(sel.value==='') return; applyCourse(rid, list[+sel.value]); render(); };
      applyRow.appendChild(useBtn);
      rb.appendChild(applyRow);
      if(R.courseName) rb.appendChild(el('<p class="empty-note" style="margin:0 0 6px">Vald bana: '+esc(R.courseName)+'</p>'));
      const chosen = list[+sel.value];
      if(chosen && chosen.note) rb.appendChild(el('<p class="empty-note" style="margin:0 0 6px">'+esc(chosen.note)+'</p>'));

      const paste = el('<div class="subcard"><h4>Klistra in par från scorekortet</h4><p>18 siffror, hål 1 först. Mellanslag, komma eller radbrytning spelar ingen roll.</p><input type="text" placeholder="4 4 3 5 4 4 3 4 5 4 3 4 5 4 4 3 4 5"><div style="display:flex;gap:8px;margin-top:8px"><button class="btn ghost">Läs in par</button></div><p class="empty-note" id="pmsg" style="margin:8px 0 0"></p></div>');
      const pInput = paste.querySelector('input'), pMsg = paste.querySelector('#pmsg');
      paste.querySelector('button').onclick = ()=>{
        const nums = (pInput.value.match(/\d+/g)||[]).map(Number);
        if(nums.length!==HOLES){ pMsg.textContent = 'Hittade '+nums.length+' siffror, behöver 18.'; return; }
        if(nums.some(n=>n<3||n>6)){ pMsg.textContent = 'Par ska ligga mellan 3 och 6.'; return; }
        R.pars = nums; R.courseName = R.courseName || 'Inklistrad bana';
        fixHoleChoices(rid); save(); render();
      };
      rb.appendChild(paste);

      const saveC = el('<div class="subcard"><h4>Spara som egen bana</h4><p>Hamnar i listan ovan för alla som använder sidan.</p><input type="text" placeholder="Namn, t.ex. Bro Hof – Stadium"><div style="display:flex;gap:8px;margin-top:8px"><button class="btn ghost">Spara bana</button></div></div>');
      const cName = saveC.querySelector('input');
      saveC.querySelector('button').onclick = ()=>{
        const nm = cName.value.trim();
        if(!nm) return;
        S.customCourses = (S.customCourses||[]).filter(c=>c.name!==nm);
        S.customCourses.push({name:nm, pars:[...R.pars]});
        R.courseName = nm;
        save(); render();
      };
      rb.appendChild(saveC);

      if((S.customCourses||[]).length){
        const own = el('<div style="margin-top:12px"><h3 class="sec">Egna banor</h3></div>');
        S.customCourses.forEach(course=>{
          const line = el('<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)"><span style="font-size:13.5px">'+esc(course.name)+' <span class="empty-note">par '+course.pars.reduce((a,b)=>a+b,0)+'</span></span></div>');
          const del = el('<button class="btn danger" style="padding:6px 10px">Ta bort</button>');
          del.onclick = ()=>{ S.customCourses = S.customCourses.filter(x=>x.name!==course.name); save(); render(); };
          line.appendChild(del);
          own.appendChild(line);
        });
        rb.appendChild(own);
      }

      rb.appendChild(el('<h3 class="sec" style="margin-top:18px">Par per hål</h3>'));
      const grid = el('<div class="parGrid"></div>');
      R.pars.forEach((p,i)=>{
        const cell = el('<div class="parCell"><span>Hål '+(i+1)+'</span><input type="number" min="3" max="6" value="'+p+'"></div>');
        const inp = cell.querySelector('input');
        inp.onchange = ()=>{ R.pars[i] = Math.min(6, Math.max(3, parseInt(inp.value,10)||4)); fixHoleChoices(rid); save(); render(); };
        grid.appendChild(cell);
      });
      rb.appendChild(grid);

      const par3 = R.pars.map((p,i)=>({p,h:i+1})).filter(x=>x.p===3).map(x=>x.h);
      rb.appendChild(el('<h3 class="sec" style="margin-top:18px">Closest to pin – välj hål</h3>'));
      const ctpRow = el('<div class="chips"></div>');
      (par3.length?par3:R.pars.map((_,i)=>i+1)).forEach(h=>{
        const on = R.ctp.includes(h);
        const b = el('<button class="chip blue" aria-pressed="'+on+'">Hål '+h+'</button>');
        b.onclick = ()=>{ R.ctp = on ? R.ctp.filter(x=>x!==h) : [...R.ctp, h].sort((a,b)=>a-b); save(); render(); };
        ctpRow.appendChild(b);
      });
      rb.appendChild(ctpRow);
      rb.appendChild(el('<p class="empty-note" style="margin:8px 0 0">'+(par3.length?'Visar bara par 3-hål.':'Inga par 3-hål inlagda ännu – välj par först.')+'</p>'));

      if(rid==='sim'){
        rb.appendChild(el('<h3 class="sec" style="margin-top:18px">Längsta drive – välj hål</h3>'));
        const ldRow = el('<div class="chips"></div>');
        R.pars.map((p,i)=>({p,h:i+1})).filter(x=>x.p>=4).forEach(x=>{
          const on = R.ld.includes(x.h);
          const b = el('<button class="chip blue" aria-pressed="'+on+'">Hål '+x.h+'</button>');
          b.onclick = ()=>{ R.ld = on ? R.ld.filter(y=>y!==x.h) : [...R.ld, x.h].sort((a,b)=>a-b); save(); render(); };
          ldRow.appendChild(b);
        });
        rb.appendChild(ldRow);
      }
      box.appendChild(c);
    });

    const rc = el('<section class="card"><div class="card-body"><h3 class="sec">Nollställ</h3><p class="empty-note" style="margin:0 0 10px">Tar bort alla slag, CTP- och drivemarkeringar. Spelare, handicap och spelformat behålls.</p><button class="btn danger">Nollställ alla resultat</button></div></section>');
    rc.querySelector('button').onclick = ()=>{
      rc.querySelector('button').textContent = 'Tryck igen för att bekräfta';
      rc.querySelector('button').onclick = ()=>{
        S.strokes = {bana:{}, sim:{}};
        S.ctpWins = {bana:{}, sim:{}};
        S.ldWins = {sim:{}};
        S.live = null;
        save(); render();
      };
    };
    box.appendChild(rc);
    return box;
  }

  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ tab = t.dataset.tab; render(); };
  });
  load();

</script>
